name: Feature request
description: 想要新的渲染 / 交互能力
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本包只改**呈现**，不新增内置工具。请先确认需求落在这条边界内。
  - type: textarea
    id: problem
    attributes:
      label: 现在哪里不舒服
      description: 描述具体场景，不要只写「希望更好看」
      placeholder: |
        一个回合里模型跑了 8 个工具，折叠后组头只写 `8 done`，
        看不出哪个工具最慢。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你想要的显示 / 行为
      description: 最好给出终端里长什么样的例子（用代码块画出来）
      placeholder: |
        ● Multiple Tools: 8 done · 3.4s · Read×5, Bash×3 · click to show more
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 有没有别的包已经这么做？你试过什么？
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 这个需求不新增内置工具，只改渲染 / 交互 / 配置
          required: true
        - label: 我愿意提 PR（维护者会先给方向）
          required: false
