name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24.x"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Configure git identity for fixture repositories
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - run: npm ci

      # 拆成分步：失败时 GitHub 能直接指出是 lint / typecheck / test 哪一步。
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # 分 4 段跑：失败时步骤名直接暴露是哪个字母区间。
      - name: Test (a–f)
        shell: bash
        run: node --test tests/[a-f]*.test.ts

      - name: Test (g–l)
        shell: bash
        run: node --test tests/[g-l]*.test.ts

      - name: Test (m–r)
        shell: bash
        run: node --test tests/[m-r]*.test.ts

      - name: Test (s–z)
        shell: bash
        run: node --test tests/[s-z]*.test.ts

      - run: npm run bench:thinking
      - run: npm pack --dry-run

      - name: Coverage report
        if: matrix.node == '24.x'
        run: npm run coverage
