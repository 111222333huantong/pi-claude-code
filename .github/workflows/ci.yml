name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24.x"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Configure git identity for fixture repositories
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - run: npm ci

      # 拆成分步：失败时 GitHub 能直接指出是 lint / typecheck / test 哪一步。
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # 分 4 段跑：失败时步骤名直接暴露是哪个字母区间。
      - name: Test (a–f)
        shell: bash
        run: node --test tests/[a-f]*.test.ts

      - name: Test (g–l)
        shell: bash
        run: node --test tests/[g-l]*.test.ts

      - name: Test main-screen-prefix
        shell: bash
        run: node --test tests/main-screen-prefix.test.ts

      - name: Test markdown-enhance
        shell: bash
        run: node --test tests/markdown-enhance.test.ts

      - name: Test mascot
        shell: bash
        run: node --test tests/mascot.test.ts

      - name: Test mcp-chip
        shell: bash
        run: node --test tests/mcp-chip.test.ts

      - name: Test mcp-title
        shell: bash
        run: node --test tests/mcp-title.test.ts

      - name: Test message-display
        shell: bash
        run: node --test tests/message-display.test.ts

      - name: Test mode-switch-reshape
        shell: bash
        run: node --test tests/mode-switch-reshape.test.ts

      - name: Test mouse-interaction
        shell: bash
        run: node --test tests/mouse-interaction.test.ts

      - name: Test mouse-scroll-native
        shell: bash
        run: node --test tests/mouse-scroll-native.test.ts

      - name: Test mouse-scroll
        shell: bash
        run: node --test tests/mouse-scroll.test.ts

      - name: Test paint-cache
        shell: bash
        run: node --test tests/paint-cache.test.ts

      - name: Test patch-registry
        shell: bash
        run: node --test tests/patch-registry.test.ts

      - name: Test pending-animation-perf
        shell: bash
        run: node --test tests/pending-animation-perf.test.ts

      - name: Test pending-dot
        shell: bash
        run: node --test tests/pending-dot.test.ts

      - name: Test pending-preview
        shell: bash
        run: node --test tests/pending-preview.test.ts

      - name: Test prompt-editor
        shell: bash
        run: node --test tests/prompt-editor.test.ts

      - name: Test quiet-startup
        shell: bash
        run: node --test tests/quiet-startup.test.ts

      - name: Test render-animation
        shell: bash
        run: node --test tests/render-animation.test.ts

      - name: Test render-cache
        shell: bash
        run: node --test tests/render-cache.test.ts

      - name: Test resume-tool-visibility
        shell: bash
        run: node --test tests/resume-tool-visibility.test.ts

      - name: Test runtime-patch-isolation
        shell: bash
        run: node --test tests/runtime-patch-isolation.test.ts

      - name: Test (s–z)
        shell: bash
        run: node --test tests/[s-z]*.test.ts

      - run: npm run bench:thinking
      - run: npm pack --dry-run

      - name: Coverage report
        if: matrix.node == '24.x'
        run: npm run coverage
