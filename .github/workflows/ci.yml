name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24.x"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Configure git identity for fixture repositories
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - run: npm ci

      # 拆成分步：失败时 GitHub 能直接指出是 lint / typecheck / test 哪一步。
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test.log
          status=$?
          if [ "$status" -ne 0 ]; then
            # 把失败上下文写成 annotation：公开仓库无需管理员权限即可读取。
            {
              head -4 /tmp/test.log
              grep -E 'not ok [0-9]+ - |Error|error:|ERR_' /tmp/test.log | head -3
              tail -3 /tmp/test.log
            } | head -10 | sed 's/^/::error::/'
          fi
          exit "$status"

      - run: npm run bench:thinking
      - run: npm pack --dry-run

      - name: Coverage report
        if: matrix.node == '24.x'
        run: npm run coverage
