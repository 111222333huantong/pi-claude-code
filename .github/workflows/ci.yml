name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24.x"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Configure git identity for fixture repositories
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"

      - run: npm ci
      - run: npm run ci
      - run: npm run bench:thinking
      - run: npm pack --dry-run

      - name: Coverage report
        if: matrix.node == '24.x'
        run: npm run coverage
